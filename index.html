<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事動画オートプレイヤー</title>
<style>
  :root { --bg:#111418; --panel:#1b2027; --line:#2c333d; --text:#e8ebef; --muted:#8a94a3; --accent:#4f9cf9; }
  * { box-sizing: border-box; }
  /* 画面全体を1画面に収め、スクロールは再生キューの中だけにする */
  html, body { height:100%; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { flex:none; padding:8px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:15px; margin:0 8px 0 0; white-space:nowrap; }
  header h1 .ver { font-size:11px; font-weight:normal; color:var(--muted); margin-left:4px; }
  input, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 10px; font:inherit; }
  input[type=url] { flex:1 1 240px; min-width:0; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { flex:1; min-height:0; display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:12px; padding:12px 16px; }
  section { display:flex; flex-direction:column; min-height:0; min-width:0; }
  #stageWrap { flex:1; min-height:0; position:relative; }
  /* 同時再生スロット。各 .cellStage はJSが矩形(left/top/w/h)を直接指定する。
     縦型ペアは2つのステージを左右に並べて表現する */
  #grid { position:relative; width:100%; height:100%; }
  .cellStage { position:absolute; background:#000; border-radius:8px; overflow:hidden; }
  .cellStage > * { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .cellStage video { object-fit:contain; }
  /* フォーカス枠は単一要素をフォーカス中スロットの矩形に合わせて移動させる */
  #focusRing { position:absolute; border:2px solid var(--accent); border-radius:8px; pointer-events:none; z-index:6; display:none; }
  /* 操作 API のないフォールバック iframe はクリックを透過させてキー入力を奪わせない。
     ステージをクリックすると .interactive が付き、一時的に iframe を操作できる */
  .cellStage iframe.np { pointer-events:none; }
  .cellStage.interactive iframe.np { pointer-events:auto; }
  #info { flex:none; }
  #now { margin:8px 0 4px; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #now a { color:var(--accent); font-weight:normal; font-size:12px; margin-left:8px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; }
  #status { color:var(--muted); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  footer { display:flex; gap:16px; justify-content:center; padding:10px 0 18px; color:var(--muted); font-size:12px; }
  footer a { color:var(--muted); }
  aside { min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:auto; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); padding:8px; gap:8px; }
    #stageWrap { flex:none; height:60vh; }
    #grid { height:100%; }
    #keys, header h1 { display:none; }
    header { padding:8px; gap:6px; }
  }
  aside h2 { font-size:13px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  ol { list-style:none; margin:0; padding:0; }
  li { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; }
  li:hover { background:#232a33; }
  li.active { background:#203048; }
  li img { width:96px; height:54px; object-fit:cover; border-radius:4px; flex:none; background:#000; }
  li .t { font-size:12px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  li .k { color:var(--muted); font-size:11px; }
  li .del { flex:none; align-self:flex-start; background:none; border:none; color:var(--muted); font-size:15px; padding:0 4px; cursor:pointer; }
  li .del:hover { color:#ff7b7b; }
  #osd { position:absolute; inset:auto auto 16px 16px; width:auto; height:auto; padding:6px 12px; background:rgba(0,0,0,.75); color:#fff; border-radius:6px; font-size:15px; pointer-events:none; opacity:0; transition:opacity .3s; z-index:2; }
  #screenBar { display:flex; justify-content:flex-end; flex:none; margin-bottom:4px; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  #screenCtl { display:inline-flex; align-items:center; gap:2px; }
  #screenCtl button { background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:15px; padding:0 10px; cursor:pointer; border-radius:6px; line-height:1.6; }
  #screenCtl button:hover { border-color:var(--accent); }
  #scrCount { width:3.4em; text-align:center; padding:2px 4px; font-size:13px; }
  #osd.show { opacity:1; }
  #keys { color:var(--muted); font-size:12px; margin-top:4px; }
  #keys kbd { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:0 5px; font:inherit; }
  /* プリセット選択: サイトアイコン付きカードのグリッド。同一サイトの別ページはカード下半分にまとめる */
  #presetWrap { position:relative; }
  #presetGrid { position:absolute; top:calc(100% + 6px); left:0; z-index:60; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; width:min(620px,92vw); max-height:55vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #presetGrid[hidden] { display:none; }
  .pcard { display:flex; flex-direction:column; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .phead { display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 4px; background:none; border:none; border-bottom:1px solid var(--line); color:var(--text); font-size:12px; font-weight:600; cursor:pointer; }
  .phead:hover, .phead:focus-visible { background:#232a33; outline:none; }
  .phead img { width:28px; height:28px; border-radius:5px; background:#000; }
  .plinks { display:flex; flex-direction:column; }
  .plink { background:none; border:none; border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; padding:5px 4px; cursor:pointer; text-align:center; }
  .plink:last-child { border-bottom:none; }
  .plink:hover, .plink:focus-visible { color:var(--text); background:#232a33; outline:none; }
  /* Shinobi 広告が body 全体を包むラッパーを挿すので、レイアウトから除外して flex を維持する */
  [data-admax-sticky-wrapper], [data-admax-sticky-wrapper] > div:first-child { display:contents !important; }
  /* 広告スクリプトが body を書き換えても高さが崩れないよう、アプリ全体を1つのコンテナにまとめる */
  #app { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; height:100dvh; }
</style>

<script>
const $ = (id) => document.getElementById(id);
// GitHub Pages など API を持たない場所で開いたときに呼ぶ Cloudflare Worker の URL（例: https://auto-play-blog-videos.xxx.workers.dev）
const WORKER_URL = 'https://auto-play-blog-videos.spankbangquadplayer.workers.dev';
const API_BASE = location.hostname.endsWith('github.io') ? WORKER_URL.replace(/\/$/, '') : '';
const queue = [];          // {type, id, title, article}
const seenVideos = new Set();
let pendingLinks = [];     // 動画抽出待ちの記事リンク
let listNext = null;       // 未取得の次の一覧ページURL
let loadingList = null;    // 取得中の一覧ページ Promise
const seenLinks = new Set();
const linksWaiters = [];   // pendingLinks の追加を待つ抽出ワーカー
function notifyLinks() { linksWaiters.splice(0).forEach((r) => r()); }
let loadToken = 0;
let reachedEnd = false;
let loadFinished = false;
// 再生設定の初期値。各スロットは生成時にこれを引き継ぐ
const prefs = { volume: 100, muted: false, rate: 1 };
let urlTimer = null;      // ?st= URL更新のデバウンス用
let osdTimer = null;
let ytApiReady = false;

window.onYouTubeIframeAPIReady = () => { ytApiReady = true; };

// プリセット一覧。同一サイトの別ページは1カードにまとめ、下半分にリンクを並べる。
// filter は記事URLの絞り込み正規表現（従来の data-filter 相当）
const PRESET_GROUPS = [
  { site: 'ToxicStream', domain: 'toxicstream.com', siteUrl: 'https://toxicstream.com/', items: [
    { label: 'ero カテゴリ', url: 'https://toxicstream.com/category/ero/' },
  ]},
  { site: 'おなりずむ', domain: 'onalism.com', siteUrl: 'https://onalism.com/', items: [
    { label: '一覧', url: 'https://onalism.com/' },
  ]},
  { site: 'ポッカキット', domain: 'www.po-kaki-to.com', siteUrl: 'https://www.po-kaki-to.com/', items: [
    { label: 'アーカイブ', url: 'https://www.po-kaki-to.com/archives' },
  ]},
  { site: '露出羞恥に魅せられて', domain: 'roshutu-shuuti.net', siteUrl: 'https://roshutu-shuuti.net/', items: [
    { label: '一覧', url: 'https://roshutu-shuuti.net/' },
  ]},
  { site: 'twi-dl', domain: 'www.twi-dl.net', siteUrl: 'https://www.twi-dl.net/', items: [
    { label: 'ランキング', url: 'https://www.twi-dl.net/rank.php', filter: 'v\\.php\\?video=' },
    { label: '新着', url: 'https://www.twi-dl.net/hozon.php', filter: 'v\\.php\\?video=' },
  ]},
  { site: 'ヌキストリーム', domain: 'www.nukistream.com', siteUrl: 'https://www.nukistream.com/', items: [
    { label: '動画一覧', url: 'https://www.nukistream.com/category.php?id=41', filter: 'video\\.php\\?id=' },
  ]},
  { site: 'monsnode', domain: 'monsnode.com', siteUrl: 'https://monsnode.com/', items: [
    { label: '新着', url: 'https://monsnode.com/' },
    { label: '24時間', url: 'https://monsnode.com/?ranking=1&period=24h' },
    { label: '3日', url: 'https://monsnode.com/?ranking=1&period=3d' },
    { label: '7日', url: 'https://monsnode.com/?ranking=1&period=7d' },
  ]},
  { site: 'monsnodes', domain: 'monsnodes.com', siteUrl: 'https://monsnodes.com/', items: [
    { label: 'Pick', url: 'https://monsnodes.com/?sort=m' },
    { label: 'New', url: 'https://monsnodes.com/?sort=n' },
    { label: 'Ranking', url: 'https://monsnodes.com/?sort=p' },
  ]},
  { site: 'missav', domain: 'missav.ws', siteUrl: 'https://missav.ws/', items: [
    { label: 'イメージビデオ', url: 'https://missav.ws/dm876/ja/genres/%E3%82%A4%E3%83%A1%E3%83%BC%E3%82%B8%E3%83%93%E3%83%87%E3%82%AA' },
    { label: '野外・露出', url: 'https://missav.ws/dm399/ja/genres/%E9%87%8E%E5%A4%96%E3%83%BB%E9%9C%B2%E5%87%BA' },
  ]},
  { site: 'xvideo-jp', domain: 'xvideo-jp.com', siteUrl: 'https://xvideo-jp.com/', items: [
    { label: '週間', url: 'https://xvideo-jp.com/?sort=week' },
    { label: '月間', url: 'https://xvideo-jp.com/?sort=month' },
    { label: '新着', url: 'https://xvideo-jp.com/' },
  ]},
  { site: 'openload', domain: 'openload.mov', siteUrl: 'https://openload.mov/', items: [
    { label: '急上昇', url: 'https://openload.mov/soaring/' },
    { label: '人気', url: 'https://openload.mov/popularity/' },
  ]},
  { site: 'FC2動画', domain: 'video.fc2.com', siteUrl: 'https://video.fc2.com/', items: [
    { label: '新着', url: 'https://video.fc2.com/a/search/video/?category_id=25' },
  ]},
  { site: 'EPORNER', domain: 'www.eporner.com', siteUrl: 'https://www.eporner.com/', items: [
    { label: '野外・日本人', url: 'https://www.eporner.com/cat/outdoor/japanese/' },
  ]},
  { site: 'DMM動画', domain: 'video.dmm.co.jp', siteUrl: 'https://video.dmm.co.jp/', items: [
    { label: 'シリーズ', url: 'https://video.dmm.co.jp/av/list/?series=4592558' },
  ]},
  { site: 'twihub', domain: 'twihub.link', siteUrl: 'https://twihub.link/', items: [
    { label: 'リアルタイム', url: 'https://twihub.link/posts?type=realtime', filter: 'posts/[0-9a-f]{8}-' },
    { label: '30日', url: 'https://twihub.link/posts?type=30d', filter: 'posts/[0-9a-f]{8}-' },
    { label: '7日', url: 'https://twihub.link/posts?type=7d', filter: 'posts/[0-9a-f]{8}-' },
    { label: '1日', url: 'https://twihub.link/posts?type=1d', filter: 'posts/[0-9a-f]{8}-' },
  ]},
];

function selectPreset(p) {
  $('url').value = p.url;
  $('filter').value = p.filter || '';
  $('presetGrid').hidden = true;
  // URL未定の項目（YouTube等）は入力欄にフォーカスするだけ
  if (!p.url) { $('url').focus(); return; }
  $('start').click();
}

(function initPresets() {
  const grid = $('presetGrid');
  for (const g of PRESET_GROUPS) {
    const card = document.createElement('div');
    card.className = 'pcard';
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'phead';
    const img = document.createElement('img');
    img.src = `https://www.google.com/s2/favicons?domain=${g.domain}&sz=128`;
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => { img.style.visibility = 'hidden'; };
    const site = document.createElement('span');
    site.textContent = g.site;
    head.title = g.siteUrl || g.items[0].url;
    head.append(img, site);
    // カード上部はサイト自体を新しいタブで開く。下半分のリンクが再生プリセット
    head.onclick = () => window.open(g.siteUrl || g.items[0].url, '_blank', 'noopener');
    const links = document.createElement('div');
    links.className = 'plinks';
    for (const p of g.items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'plink';
      b.textContent = p.label;
      b.title = p.url;
      b.onclick = () => selectPreset(p);
      links.appendChild(b);
    }
    card.append(head, links);
    grid.appendChild(card);
  }
  $('presetBtn').onclick = (e) => { e.stopPropagation(); grid.hidden = !grid.hidden; };
  document.addEventListener('click', (e) => {
    if (!grid.hidden && !e.target.closest('#presetWrap')) grid.hidden = true;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') grid.hidden = true; });
})();

function setStatus(s) { $('status').textContent = s; }

function thumb(v) {
  if (v.thumb) return v.thumb;
  if (v.type === 'youtube') return `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
  if (v.type === 'dailymotion') return `https://www.dailymotion.com/thumbnail/video/${v.id}`;
  return '';
}

// ---- 同時再生スロット ----
// キューを上から順に各スロットへ割り当て、終わったスロットから次を再生する
const slots = [];
let multiCount = 4, focusIdx = 0;
const fedSet = new Set();      // このセッションで割当済みのキューindex
const playingIdx = new Set();  // 現在スロットが再生中のキューindex
const focusSlot = () => slots[focusIdx] || slots[0];

function makeSlot() {
  const stage = document.createElement('div');
  stage.className = 'cellStage';
  // フォールバック iframe は普段クリックを透過するが、ステージをクリックすると
  // 8秒間だけ iframe 内を操作できる（自動再生がブロックされた時の再生ボタン用）
  stage.addEventListener('pointerdown', () => {
    stage.classList.add('interactive');
    clearTimeout(stage._ipTimer);
    stage._ipTimer = setTimeout(() => stage.classList.remove('interactive'), 8000);
  });
  return { stage, rect: null, video: null, qi: -1, lastQi: -1, kind: null, resumeTime: 0, orient: 'h',
    prefs: { volume: prefs.volume, muted: prefs.muted, rate: 1 },
    yt: null, ytReady: false, ytPending: null, vimeo: null, videoEl: null, hls: null,
    embed: null, fallbackTimer: null, rateTimer: null };
}

// ---- レイアウト ----
// 縦型動画を2本ずつペアにして領域を左右分割し、残りは矩形の再帰分割で配置する。
// メディア要素は動かさず .cellStage の矩形だけを書き換えるため、
// 再レイアウトで iframe 系プレイヤーがリロードされることはない
const GAP = 3; // セル間の隙間(px)
const rectCSS = (r) => ({
  left: `calc(${r.x * 100}% + ${GAP}px)`, top: `calc(${r.y * 100}% + ${GAP}px)`,
  width: `calc(${r.w * 100}% - ${GAP * 2}px)`, height: `calc(${r.h * 100}% - ${GAP * 2}px)`,
});

// 縦横判定は file/hls の loadedmetadata で確定。iframe 系は判定できないので横型扱い。
// 判定結果はキュー項目にも保存し、スロット再構築や再読み込み後も引き継ぐ
function slotPortrait(s) { return s.orient === 'v'; }

function noteOrient(s) {
  const el = s.videoEl;
  if (!el || !el.videoWidth) return;
  const o = el.videoWidth > el.videoHeight ? 'h' : 'v';
  s.orient = o;
  if (s.video) s.video.orient = o;
  rebuildLayout();
}

// ペアは「縦型スロットをスロット順に2本ずつ」。奇数の余りは通常セル扱い。
// レイアウトでは通常項目を先・ペアを後に並べ、ペア同士がまとまるようにする
function buildItems() {
  const por = slots.filter(slotPortrait);
  const partner = new Map();
  for (let i = 0; i + 1 < por.length; i += 2) {
    partner.set(por[i], por[i + 1]);
    partner.set(por[i + 1], por[i]);
  }
  const done = new Set(), singles = [], pairs = [];
  for (const s of slots) {
    const p = partner.get(s);
    if (p) {
      if (done.has(s)) continue;
      done.add(s); done.add(p);
      pairs.push({ type: 'pair', slots: [s, p] });
    } else singles.push({ type: 'single', slots: [s] });
  }
  return singles.concat(pairs);
}

// items を行優先で rows 段に均等配置する。各行のアイテム数はできるだけ均し、
// ペア項目はセルを左右50:50に分割して2スロットに割り当てる
function layoutRows(items, rect, rows) {
  const n = items.length;
  rows = Math.max(1, Math.min(rows, n));
  const base = Math.floor(n / rows), rem = n % rows;
  const rh = rect.h / rows;
  let idx = 0;
  for (let r = 0; r < rows; r++) {
    const cnt = base + (r < rem ? 1 : 0), rw = rect.w / cnt;
    for (let c = 0; c < cnt; c++, idx++) {
      const it = items[idx];
      const cell = { x: rect.x + c * rw, y: rect.y + r * rh, w: rw, h: rh };
      if (it.type === 'pair') {
        const [a, b] = it.slots;
        a.rect = { x: cell.x, y: cell.y, w: cell.w / 2, h: cell.h };
        b.rect = { x: cell.x + cell.w / 2, y: cell.y, w: cell.w / 2, h: cell.h };
      } else it.slots[0].rect = { ...cell };
    }
  }
}

let layoutTimer = null;
function scheduleRelayout() {
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(rebuildLayout, 120);
}

// レイアウトは「通常セルのエリア（左）」と「縦型ペアのエリア（右）」の2ゾーン。
// ゾーンの幅は動画数の比で分け、各ゾーン内は行数をアスペクト比から決めて均等配置する
function rebuildLayout() {
  const grid = $('grid');
  const ca = grid.clientHeight ? grid.clientWidth / grid.clientHeight : 16 / 9;
  const items = buildItems();
  const pairs = items.filter((i) => i.type === 'pair');
  const singles = items.filter((i) => i.type === 'single');
  const full = { x: 0, y: 0, w: 1, h: 1 };
  if (!pairs.length) {
    // 縦型ペアなし: 全て通常セル。セルの目標アスペクトを 16:9 として行数を決める
    const rows = Math.max(1, Math.round(Math.sqrt(singles.length * (16 / 9) / ca)));
    layoutRows(singles, full, rows);
  } else {
    // 通常:縦型ペア = 動画数比で画面を左右に分割
    const frac = singles.length / (singles.length + pairs.length * 2);
    if (singles.length) {
      const za = frac * ca;
      const rows = Math.max(1, Math.round(Math.sqrt(singles.length * (16 / 9) / za)));
      layoutRows(singles, { x: 0, y: 0, w: frac, h: 1 }, rows);
    }
    const pa = (1 - frac) * ca;
    // ペアセル（縦型2本を左右に並べた形）の目標アスペクトを約 9:8 として行数を決める
    const rows = Math.max(1, Math.round(Math.sqrt(pairs.length * 1.125 / pa)));
    layoutRows(pairs, { x: frac, y: 0, w: 1 - frac, h: 1 }, rows);
  }
  for (const s of slots) {
    // ステージは一度 grid に入れたら動かさない（iframe のリロード防止）。
    // setMultiCount で innerHTML を消した直後だけ付け直す
    if (s.stage.parentNode !== grid) grid.appendChild(s.stage);
    const css = rectCSS(s.rect || { x: 0, y: 0, w: 1, h: 1 });
    for (const k in css) s.stage.style[k] = css[k];
  }
  updateFocus();
}

// スロットが再生中の位置（秒）を取る。iframe 系は位置を取得できないので 0
async function slotPosition(s) {
  try {
    if (s.kind === 'file' || s.kind === 'hls') return s.videoEl?.currentTime || 0;
    if (s.kind === 'youtube' && s.yt && s.ytReady) return s.yt.getCurrentTime() || 0;
    if (s.kind === 'vimeo' && s.vimeo) return (await s.vimeo.getCurrentTime()) || 0;
  } catch { /* 取れなければ先頭から */ }
  return 0;
}

async function setMultiCount(n) {
  n = Math.max(1, Math.min(9, Math.floor(n) || 1));
  if (n === multiCount && slots.length) return;
  multiCount = n;
  $('scrCount').value = n;
  // 再生中スロットのキューindexと再生位置を退避し、作り直し後に同じ動画を再割当てする
  const saved = await Promise.all(slots.map(async (s) => ({ qi: s.qi, pos: s.qi >= 0 ? await slotPosition(s) : 0 })));
  for (const s of slots) clearSlotMedia(s);
  $('grid').innerHTML = '';
  slots.length = 0;
  for (let i = 0; i < n; i++) slots.push(makeSlot());
  rebuildLayout();
  focusIdx = 0;
  const kept = new Set();
  saved.forEach((sv, i) => {
    if (i >= n || sv.qi < 0) return;
    const v = queue[sv.qi];
    if (!v || v.removed) return;
    kept.add(sv.qi);
    slotLoad(slots[i], sv.qi, sv.pos);
  });
  // 画面数を減らして外れた動画は未再生に戻し、あとで再生されるようにする
  for (const sv of saved) {
    if (sv.qi >= 0 && !kept.has(sv.qi) && playingIdx.has(sv.qi)) {
      fedSet.delete(sv.qi); playingIdx.delete(sv.qi);
    }
  }
  pump();
  updateFocus();
  scheduleUrlUpdate();
}

function updateFocus() {
  // フォーカス枠は単一要素をフォーカス中スロットの矩形に合わせる
  const s = focusSlot(), ring = $('focusRing');
  if (s && s.rect && s.stage.parentNode) {
    ring.style.display = 'block';
    const css = rectCSS(s.rect);
    ring.style.left = css.left; ring.style.top = css.top;
    ring.style.width = css.width; ring.style.height = css.height;
  } else ring.style.display = 'none';
  updateNow();
}

// 矩形レイアウトでは列数が一定でないため、フォーカス移動は
// 各ステージの実座標から「その方向で最も近い」スロットを選ぶ
function moveFocus(dir) {
  const cur = focusSlot();
  if (!cur || !cur.stage.parentNode) return;
  const cr = cur.stage.getBoundingClientRect();
  const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
  let best = null, bs = Infinity;
  for (const s of slots) {
    if (s === cur || !s.stage.parentNode) continue;
    const r = s.stage.getBoundingClientRect();
    const dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
    const ok = dir === 'left' ? dx < -2 : dir === 'right' ? dx > 2 : dir === 'up' ? dy < -2 : dy > 2;
    if (!ok) continue;
    // 主軸方向の距離を優先し、直交方向のずれをペナルティにする
    const primary = dir === 'left' || dir === 'right' ? Math.abs(dx) : Math.abs(dy);
    const cross = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    const score = primary + cross * 3;
    if (score < bs) { bs = score; best = s; }
  }
  if (best) { focusIdx = slots.indexOf(best); updateFocus(); }
}

function updateNow() {
  const v = focusSlot()?.video;
  $('now').innerHTML = '';
  if (!v) {
    $('now').textContent = queue.length ? '（再生待機）' : '一覧URLを入力して「読み込んで再生」を押してください';
    return;
  }
  if (v) {
    const a = document.createElement('a');
    a.href = v.article; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '記事を開く ↗';
    $('now').append(a);
  }
}

function resetFeed() {
  fedSet.clear(); playingIdx.clear();
  for (const s of slots) { s.qi = -1; s.lastQi = -1; s.video = null; s.kind = null; clearSlotMedia(s); }
  reachedEnd = false;
  renderQueue();
  updateNow();
}

function clearSlotMedia(s) {
  clearTimeout(s.fallbackTimer);
  clearInterval(s.rateTimer);
  s.fallbackTimer = s.rateTimer = null;
  try { s.yt && s.yt.destroy(); } catch {}
  try { s.vimeo && (s.vimeo.destroy ? s.vimeo.destroy() : s.vimeo.unload()); } catch {}
  try { s.hls && s.hls.destroy(); } catch {}
  s.stage.innerHTML = '';
  s.yt = s.vimeo = s.videoEl = s.embed = s.hls = null;
  s.ytReady = false; s.ytPending = null;
}

// 未再生のキューindexを1つ返す（シャッフル時はランダム）
function pickNext() {
  if (!queue.length) return -1;
  if ($('shuffle').checked) {
    const avail = [];
    for (let i = 0; i < queue.length; i++) if (!fedSet.has(i) && !queue[i].removed) avail.push(i);
    return avail.length ? avail[Math.floor(Math.random() * avail.length)] : -1;
  }
  for (let i = 0; i < queue.length; i++) if (!fedSet.has(i) && !queue[i].removed) return i;
  return -1;
}

function checkEnd() {
  if (slots.length && slots.every((s) => s.qi < 0) && pickNext() < 0 && loadFinished) {
    reachedEnd = true;
    setStatus('キューの最後まで再生しました');
  }
}

// 空いているスロットに次の動画を割り当てる
function pump() {
  for (const s of slots) {
    if (s.qi >= 0) continue;
    const qi = pickNext();
    if (qi < 0) continue;
    slotLoad(s, qi);
  }
  checkEnd();
  updateNow();
}

function slotLoad(s, qi, resume = 0) {
  const v = queue[qi];
  if (!v) return;
  fedSet.add(qi); playingIdx.add(qi);
  s.qi = qi; s.lastQi = qi; s.video = v;
  clearSlotMedia(s);
  s.kind = v.type;
  s.resumeTime = resume;
  // 前回の判定結果があれば即座に縦横を反映し、なければ横型として扱う
  s.orient = v.orient || 'h';
  if (v.type === 'youtube') slotPlayYoutube(s, v);
  else if (v.type === 'vimeo') slotPlayVimeo(s, v);
  else if (v.type === 'file') slotPlayFile(s, v);
  else if (v.type === 'hls') slotPlayHls(s, v);
  else if (v.type === 'tokyomotion' || v.type === 'pornhub' || v.type === 'javynow' || v.type === 'openload') slotPlayFrame(s, v);
  else if (embedAdapters[v.type]) slotPlayEmbed(s, v);
  else s.fallbackTimer = setTimeout(() => slotDone(s), Math.max(10, +$('timeout').value) * 1000);
  scheduleRelayout();
  renderQueue();
  updateNow();
  scheduleUrlUpdate();
}

function slotPlayYoutube(s, v) {
  if (!ytApiReady) {
    s.fallbackTimer = setTimeout(() => { if (s.video === v && s.qi >= 0) slotPlayYoutube(s, v); }, 500);
    return;
  }
  const holder = document.createElement('div');
  s.stage.appendChild(holder);
  s.ytReady = false; s.ytPending = v.id;
  s.yt = new YT.Player(holder, {
    videoId: v.id,
    playerVars: { autoplay: 1, rel: 0, playsinline: 1 },
    events: {
      onReady: (e) => {
        s.ytReady = true;
        const pid = s.ytPending; s.ytPending = null;
        if (pid && pid !== v.id) e.target.loadVideoById(pid); else e.target.playVideo();
        if (s.resumeTime > 0) { e.target.seekTo(s.resumeTime, true); s.resumeTime = 0; }
        applySlotPrefs(s);
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) slotDone(s);
        else if (e.data === YT.PlayerState.PLAYING) applySlotPrefs(s);
      },
      onError: () => { setStatus('この動画は埋め込み再生できないためスキップしました'); slotDone(s); },
      onAutoplayBlocked: () => slotAutoplayBlocked(s),
    },
  });
}

function slotPlayVimeo(s, v) {
  const f = document.createElement('iframe');
  f.src = `https://player.vimeo.com/video/${v.id}?autoplay=1`;
  f.allow = 'autoplay; fullscreen; picture-in-picture';
  s.stage.appendChild(f);
  const p = s.vimeo = new Vimeo.Player(f);
  p.on('ended', () => slotDone(s));
  p.on('error', () => slotDone(s));
  p.ready().then(() => {
    if (s.resumeTime > 0) { p.setCurrentTime(s.resumeTime); s.resumeTime = 0; }
    applySlotPrefs(s);
  });
}

function slotPlayFile(s, v) {
  const el = s.videoEl = document.createElement('video');
  el.onloadedmetadata = () => {
    noteOrient(s);
    if (s.resumeTime > 0) { el.currentTime = s.resumeTime; s.resumeTime = 0; }
    applySlotPrefs(s);
  };
  el.referrerPolicy = 'no-referrer';
  el.src = v.id; el.controls = true; el.autoplay = true; el.playsInline = true;
  el.onended = () => slotDone(s);
  el.onerror = () => { setStatus('動画ファイルを再生できないためスキップしました'); slotDone(s); };
  s.stage.appendChild(el);
  el.play().catch((err) => { if (err.name === 'NotAllowedError') slotAutoplayBlocked(s); });
}

function slotPlayHls(s, v) {
  // HLS(m3u8) を hls.js で自前再生する。署名付きURLなので取得は /api/videos 時点のものを使う
  const el = s.videoEl = document.createElement('video');
  el.onloadedmetadata = () => {
    noteOrient(s);
    if (s.resumeTime > 0) { el.currentTime = s.resumeTime; s.resumeTime = 0; }
    applySlotPrefs(s);
  };
  el.referrerPolicy = 'no-referrer';
  el.controls = true; el.autoplay = true; el.playsInline = true;
  el.onended = () => slotDone(s);
  el.onerror = () => { setStatus('動画ファイルを再生できないためスキップしました'); slotDone(s); };
  s.stage.appendChild(el);
  if (window.Hls && Hls.isSupported()) {
    const hls = s.hls = new Hls();
    hls.loadSource(v.id);
    hls.attachMedia(el);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      applySlotPrefs(s);
      el.play().catch((err) => { if (err.name === 'NotAllowedError') slotAutoplayBlocked(s); });
    });
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) { setStatus(`HLS 再生エラー: ${d.details}`); slotDone(s); }
    });
  } else if (el.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari 等のネイティブ HLS 対応ブラウザ
    el.src = v.id;
    el.play().catch((err) => { if (err.name === 'NotAllowedError') slotAutoplayBlocked(s); });
  } else {
    setStatus('このブラウザは HLS 再生に対応していません');
    slotDone(s);
  }
}

function slotPlayFrame(s, v) {
  // 操作 API のない埋め込みは iframe 表示とタイムアウトでの自動送りのみ（mp4 解決に失敗した場合のフォールバック）
  const f = document.createElement('iframe');
  f.className = 'np';
  f.src = v.type === 'openload' ? v.id
    : v.type === 'pornhub' ? `https://www.pornhub.com/embed/${v.id}?autoplay=1`
    : v.type === 'javynow' ? `https://javynow.com/player/${v.id}/`
    : `https://www.tokyomotion.net/embed/${v.id}?autoplay=1`;
  f.allow = 'autoplay; fullscreen; picture-in-picture';
  s.stage.appendChild(f);
  s.fallbackTimer = setTimeout(() => slotDone(s), Math.max(10, +$('timeout').value) * 1000);
}

function slotPlayEmbed(s, v) {
  const adapter = embedAdapters[v.type];
  const f = document.createElement('iframe');
  f.src = adapter.src(v.id);
  f.allow = 'autoplay; fullscreen; picture-in-picture';
  s.stage.appendChild(f);
  s.embed = { kind: v.type, frame: f, adapter, time: 0, paused: false };
  // プレイヤーから応答がなければ終了も検知できないので、一定時間で次へ進む
  s.fallbackTimer = setTimeout(() => slotDone(s), Math.max(10, +$('timeout').value) * 1000);
}

function slotDone(s) {
  if (s.qi >= 0) { playingIdx.delete(s.qi); s.lastQi = s.qi; s.qi = -1; s.video = null; }
  clearSlotMedia(s);
  renderQueue();
  pump();
  scheduleUrlUpdate();
}

// キューの任意indexをそのスロットで再生する（リストクリック・B/N 用）
function slotPlayIndex(s, qi) {
  const v = queue[qi];
  if (!v || v.removed) return;
  // そのindexより後を未割当に戻し、連続再生の続きとして扱えるようにする
  for (const i of [...fedSet]) if (i > qi && !playingIdx.has(i)) fedSet.delete(i);
  if (s.qi >= 0) playingIdx.delete(s.qi);
  slotLoad(s, qi);
}

function skipSlot(s) {
  if (s.qi >= 0) slotDone(s); else pump();
}

function prevSlot(s) {
  const cur = s.qi >= 0 ? s.qi : s.lastQi;
  const t = cur > 0 ? cur - 1 : 0;
  if (queue[t]) slotPlayIndex(s, t);
}

function restartSlot(s) {
  const qi = s.qi >= 0 ? s.qi : s.lastQi;
  if (qi >= 0 && queue[qi]) slotLoad(s, qi);
}

// キュー項目を削除する。スロット側は index で管理しているため splice せず removed フラグを立てる
function removeQueueItem(i) {
  const v = queue[i];
  if (!v || v.removed) return;
  v.removed = true;
  // 再生中のものを消した場合はそのスロットを次へ進める
  if (playingIdx.has(i)) {
    const s = slots.find((x) => x.qi === i);
    if (s) slotDone(s);
  }
  renderQueue();
}

function renderQueue() {
  const rest = queue.reduce((n, v) => n + (v.removed ? 0 : 1), 0);
  $('qhead').textContent = `再生キュー (${rest})`;
  const ol = $('queue');
  ol.innerHTML = '';
  queue.forEach((v, i) => {
    if (v.removed) return;
    const li = document.createElement('li');
    li.dataset.qi = i;
    if (playingIdx.has(i)) li.className = 'active';
    li.innerHTML = `${thumb(v) ? `<img loading="lazy" src="${thumb(v)}" alt="">` : ''}<div><div class="t"></div><div class="k">${v.type}</div></div>`;
    li.querySelector('.t').textContent = v.title || v.article;
    li.onclick = () => slotPlayIndex(focusSlot(), i);
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '×'; del.title = 'キューから削除';
    del.onclick = (e) => { e.stopPropagation(); removeQueueItem(i); };
    li.appendChild(del);
    ol.appendChild(li);
  });
  const qi = focusSlot()?.qi;
  if (qi >= 0 && !queue[qi]?.removed) ol.querySelector(`[data-qi="${qi}"]`)?.scrollIntoView({ block: 'nearest' });
}

// 次の一覧ページを1ページ分だけ取得して抽出待ちキューに追加する
async function fetchNextListPage() {
  if (!listNext || loadingList) return loadingList;
  const token = loadToken;
  loadingList = (async () => {
    try {
      const params = { url: listNext, pages: 1 };
      if ($('filter').value.trim()) params.filter = $('filter').value.trim();
      const { links, next } = await api('/api/list', params);
      if (token !== loadToken) return;
      listNext = next || null;
      for (const l of links) if (!seenLinks.has(l.url)) { seenLinks.add(l.url); pendingLinks.push(l); }
      setStatus(`一覧を追加読み込み（抽出待ち ${pendingLinks.length} 記事）`);
    } catch (e) {
      console.warn(e);
      if (token === loadToken) listNext = null;
    } finally {
      loadingList = null;
      notifyLinks();
    }
  })();
  return loadingList;
}

// missav 系はサーバー(Worker)の IP ではブロックされるため、ブラウザから直接取得する。
// サイトが CORS でオリジンを反射するので fetch で読める。抽出ロジックは src/core.js を共用
const MISSAV_HOST_RE = /(^|\.)(missav\d*|thisav)\.[a-z.]+$/i;
// www 無しは CORS 付きリダイレクトを返さず fetch が失敗するため www 付きのミラーを優先する
const MISSAV_MIRRORS = ['https://www.missav06.net', 'https://www.thisav.my'];
const isMissavUrl = (s) => { try { return MISSAV_HOST_RE.test(new URL(s).hostname); } catch { return false; } };

async function missavCore() { return import('./src/core.js'); }

async function missavFetchHtml(url) {
  const u = new URL(url);
  const path = u.pathname + u.search;
  const candidates = [...MISSAV_MIRRORS.map((m) => m + path), url];
  let lastErr = null;
  for (const c of candidates) {
    try {
      const r = await fetch(c, { credentials: 'omit' });
      if (!r.ok) continue;
      const html = await r.text();
      if (!/Just a moment|cf-chl|_cf_chl_opt|Attention Required/i.test(html)) return html;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('missav の取得に失敗しました（ミラーサイト変更の可能性）');
}

async function apiListMissav(params) {
  const core = await missavCore();
  const filter = params.filter ? new RegExp(params.filter) : null;
  const pages = Math.min(Math.max(parseInt(params.pages || '1', 10), 1), 50);
  const all = [], seen = new Set(), pageSeen = new Set([params.url]);
  let url = params.url, fetched = 0, next = null;
  while (url && fetched < pages) {
    const html = await missavFetchHtml(url);
    fetched++;
    const r = core.extractList(html, url, filter);
    for (const l of r.links) if (!seen.has(l.url)) { seen.add(l.url); all.push(l); }
    next = r.next && !pageSeen.has(r.next) ? r.next : null;
    url = next;
    if (url) pageSeen.add(url);
  }
  return { links: all, pagesFetched: fetched, next: url };
}

async function apiVideosMissav(params) {
  const core = await missavCore();
  const html = await missavFetchHtml(params.url);
  const videos = core.extractVideos(html, params.url);
  const thumb = core.pageThumb(html, params.url);
  if (thumb) for (const v of videos) v.thumb = v.thumb || thumb;
  // HLS の配信 CDN は Origin ヘッダー付きリクエストを弾くため、ブラウザからは直接取れない。
  // /api/hls プロキシ経由にして Referer をサーバー側で付けてもらう
  for (const v of videos) {
    if (v.type === 'hls') v.id = `${API_BASE}/api/hls?u=${encodeURIComponent(v.id)}`;
  }
  return { title: core.pageTitle(html), videos };
}

async function api(path, params) {
  if (isMissavUrl(params.url)) {
    if (path === '/api/list') return apiListMissav(params);
    if (path === '/api/videos') return apiVideosMissav(params);
  }
  if (location.hostname.endsWith('github.io') && !API_BASE) {
    throw new Error('GitHub Pages では API が動きません。index.html の WORKER_URL に Cloudflare Worker の URL を設定してください');
  }
  const r = await fetch(API_BASE + path + '?' + new URLSearchParams(params));
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); } catch {
    throw new Error(`API から JSON 以外の応答が返りました（HTTP ${r.status}）。API サーバー（server.js / Worker）経由で開いているか確認してください`);
  }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

$('start').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) return;
  const token = ++loadToken;
  queue.length = 0; seenVideos.clear();
  pendingLinks = []; seenLinks.clear(); listNext = null; loadingList = null;
  notifyLinks(); // 前回の待機ワーカーを起こして終了させる
  resetFeed();
  try {
    setStatus('記事一覧を取得中…');
    const params = { url, pages: $('pages').value };
    if ($('filter').value.trim()) params.filter = $('filter').value.trim();
    // 同じ一覧をあとで開き直したり共有したりできるよう、条件をアドレスバーに残す。
    // 画面数 n= は共有リンク用に引き継ぐ
    const q = new URLSearchParams(params);
    const nParam = new URLSearchParams(location.search).get('n');
    if (nParam) q.set('n', nParam);
    history.replaceState(null, '', '?' + q);
    const { links, pagesFetched, next } = await api('/api/list', params);
    listNext = next || null;
    for (const l of links) if (!seenLinks.has(l.url)) { seenLinks.add(l.url); pendingLinks.push(l); }
    setStatus(`${pagesFetched}ページから記事 ${pendingLinks.length} 件を見つけました。動画を抽出中…`);
    let done = 0;
    const worker = async () => {
      while (token === loadToken) {
        const l = pendingLinks.shift();
        if (!l) {
          // 記事が尽きたら、キューのスクロールによる次ページ読み込みを待つ
          if (!listNext) break;
          await new Promise((r) => linksWaiters.push(r));
          continue;
        }
        try {
          const { title, videos } = await api('/api/videos', { url: l.url });
          for (const v of videos) {
            const key = v.type + ':' + v.id;
            if (seenVideos.has(key)) continue;
            seenVideos.add(key);
            // 記事ページが「Link to external site」のような中継ページの場合は一覧側のタイトルを使う
            const pt = title && !/^link to external site/i.test(title.trim()) ? title : l.title;
            queue.push({ ...v, thumb: v.thumb || l.thumb, title: pt || '', article: l.url });
            pump();
          }
        } catch (e) { console.warn(l.url, e); }
        if (token !== loadToken) return;
        done++;
        setStatus(`動画抽出 ${done} 記事・キュー ${queue.length} 本`);
        renderQueue();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (token === loadToken) {
      loadFinished = true;
      pump();
      setStatus(`抽出完了: ${done} 記事から ${queue.length} 本の動画`);
    }
  } catch (e) {
    setStatus('エラー: ' + e.message);
  }
};

// キューを下までスクロールしたら次の一覧ページを読み込む（無限スクロール）
$('queue').closest('aside').addEventListener('scroll', (e) => {
  const el = e.currentTarget;
  if (el.scrollTop + el.clientHeight > el.scrollHeight - 240) fetchNextListPage();
});


// ---- postMessage で操作するプレイヤー（Dailymotion / ニコニコ動画） ----
// parse はプレイヤーからのメッセージを {ready, ended, error, time, paused} に変換する
const embedAdapters = {
  dailymotion: {
    src: (id) => `https://www.dailymotion.com/embed/video/${id}?api=postMessage&autoplay=1&origin=${encodeURIComponent(location.origin)}`,
    send(f, command, parameters = []) { f.contentWindow.postMessage(JSON.stringify({ command, parameters }), 'https://www.dailymotion.com'); },
    play(f) { this.send(f, 'play'); },
    pause(f) { this.send(f, 'pause'); },
    seek(f, sec) { this.send(f, 'seek', [sec]); },
    setVolume(f, volume, muted) { this.send(f, 'volume', [volume]); this.send(f, 'muted', [muted]); },
    parse(data) {
      let m = data;
      if (typeof data === 'string') {
        try { m = JSON.parse(data); } catch { m = Object.fromEntries(new URLSearchParams(data)); }
      }
      const ev = m?.event;
      if (!ev) return {};
      return {
        ready: ev === 'apiready',
        ended: ev === 'video_end' || ev === 'end' || ev === 'ended',
        error: ev === 'error',
        time: ev === 'timeupdate' && m.time !== undefined ? +m.time : undefined,
        paused: ev === 'pause' ? true : ev === 'playing' || ev === 'play' ? false : undefined,
      };
    },
  },
  niconico: {
    src: (id) => `https://embed.nicovideo.jp/watch/${id}?jsapi=1&playerId=1`,
    send(f, eventName, data) { f.contentWindow.postMessage({ eventName, data, sourceConnectorType: 1, playerId: '1' }, 'https://embed.nicovideo.jp'); },
    play(f) { this.send(f, 'play'); },
    pause(f) { this.send(f, 'pause'); },
    seek(f, sec) { this.send(f, 'seek', { time: sec * 1000 }); },
    setVolume(f, volume, muted) { this.send(f, 'volumeChange', { volume }); this.send(f, 'mute', { mute: muted }); },
    parse(m) {
      const ev = m?.eventName, d = m?.data ?? {};
      if (!ev) return {};
      const status = ev === 'playerStatusChange' ? d.playerStatus : undefined;
      return {
        ready: ev === 'loadComplete',
        ended: status === 4,
        error: ev === 'error',
        time: ev === 'playerMetadataChange' && d.currentTime !== undefined ? d.currentTime / 1000 : undefined,
        paused: status === 3 ? true : status === 2 ? false : undefined,
      };
    },
  },
};

window.addEventListener('message', (e) => {
  const s = slots.find((x) => x.embed && e.source === x.embed.frame.contentWindow);
  if (!s) return;
  const { frame, adapter } = s.embed;
  const r = adapter.parse(e.data);
  if (r.ready) {
    // 応答があったので終了を検知できる。一定時間での自動送りは取り消す
    clearTimeout(s.fallbackTimer);
    adapter.play(frame);
    applySlotPrefs(s);
  }
  if (r.time !== undefined) s.embed.time = r.time;
  if (r.paused !== undefined) s.embed.paused = r.paused;
  if (r.error) { setStatus('この動画は埋め込み再生できないためスキップしました'); slotDone(s); }
  else if (r.ended) slotDone(s);
});

// ---- 再生制御（スロット単位） ----
async function getSlotTime(s) {
  if (s.videoEl) return s.videoEl.currentTime;
  if (s.kind === 'vimeo' && s.vimeo) return s.vimeo.getCurrentTime();
  if (s.kind === 'youtube' && s.yt) return s.yt.getCurrentTime();
  return s.embed ? s.embed.time : 0;
}

async function seekSlotBy(s, sec) {
  if (s.qi < 0) return;
  const t = Math.max(0, (await getSlotTime(s)) + sec);
  if (s.videoEl) s.videoEl.currentTime = t;
  else if (s.kind === 'vimeo' && s.vimeo) await s.vimeo.setCurrentTime(t).catch(() => {});
  else if (s.kind === 'youtube' && s.yt) s.yt.seekTo(t, true);
  else if (s.embed) { s.embed.adapter.seek(s.embed.frame, t); s.embed.time = t; }
}

async function toggleSlot(s) {
  if (s.videoEl) { if (s.videoEl.paused) { s.videoEl.play(); return true; } s.videoEl.pause(); return false; }
  if (s.kind === 'vimeo' && s.vimeo) { if (await s.vimeo.getPaused()) { s.vimeo.play(); return true; } s.vimeo.pause(); return false; }
  if (s.kind === 'youtube' && s.yt) {
    if (s.yt.getPlayerState() === YT.PlayerState.PLAYING) { s.yt.pauseVideo(); return false; }
    s.yt.playVideo(); return true;
  }
  if (s.embed) {
    s.embed.paused = !s.embed.paused;
    s.embed.paused ? s.embed.adapter.pause(s.embed.frame) : s.embed.adapter.play(s.embed.frame);
    return !s.embed.paused;
  }
  return false;
}

// プレイヤーが対応する最大速度（YouTube/Vimeo は 2 倍まで、埋め込みは速度変更なし）。超える分はシークで早送りを補う
const nativeMaxRate = (s) => s.videoEl ? 16 : s.embed ? 1 : 2;

function applySlotPrefs(s) {
  if (s.qi < 0) return;
  const native = Math.min(s.prefs.rate, nativeMaxRate(s));
  if (s.videoEl) {
    s.videoEl.volume = s.prefs.volume / 100; s.videoEl.muted = s.prefs.muted; s.videoEl.playbackRate = native;
  } else if (s.kind === 'vimeo' && s.vimeo) {
    s.vimeo.setVolume(s.prefs.muted ? 0 : s.prefs.volume / 100).catch(() => {});
    s.vimeo.setPlaybackRate(native).catch(() => {});
  } else if (s.kind === 'youtube' && s.yt) {
    s.yt.setVolume(s.prefs.volume);
    s.prefs.muted ? s.yt.mute() : s.yt.unMute();
    s.yt.setPlaybackRate(native);
  } else if (s.embed) {
    s.embed.adapter.setVolume(s.embed.frame, s.prefs.volume / 100, s.prefs.muted);
  }
  clearInterval(s.rateTimer); s.rateTimer = null;
  const extra = s.prefs.rate - native;
  if (extra > 0) {
    // シーク後のバッファリング中も実時間ぶん進め、目標速度に近づける
    let last = performance.now();
    s.rateTimer = setInterval(async () => {
      const now = performance.now(), dt = (now - last) / 1000;
      last = now;
      if (s.qi < 0) return;
      const playing = s.kind === 'youtube' ? s.yt && [YT.PlayerState.PLAYING, YT.PlayerState.BUFFERING].includes(s.yt.getPlayerState())
        : s.kind === 'vimeo' ? s.vimeo && !(await s.vimeo.getPaused())
        : s.embed ? !s.embed.paused : false;
      if (playing) seekSlotBy(s, extra * dt);
    }, 500);
  }
  scheduleUrlUpdate();
}

// ブラウザが音声付きの自動再生を止めたときは、ミュートなら許可されるのでミュートで再生し直す
function slotAutoplayBlocked(s) {
  s.prefs.muted = true; prefs.muted = true;
  applySlotPrefs(s);
  if (s.kind === 'youtube' && s.yt) s.yt.playVideo();
  else if (s.videoEl) s.videoEl.play().catch(() => {});
  else if (s.embed) s.embed.adapter.play(s.embed.frame);
  osd('自動再生がブロックされたためミュートで再生中（M で解除）');
  setStatus('ブラウザの自動再生制限によりミュートで再生しています。M キーで音声を戻せます');
}

function osd(text) {
  const el = $('osd');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(osdTimer);
  osdTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

function setSlotVolume(s, v) {
  s.prefs.volume = Math.max(0, Math.min(100, v));
  s.prefs.muted = false;
  prefs.volume = s.prefs.volume; prefs.muted = false;
  applySlotPrefs(s);
  osd(`音量 ${s.prefs.volume}%`);
}

function setSlotRate(s, r) {
  s.prefs.rate = r;
  prefs.rate = r;
  applySlotPrefs(s);
  osd(r === 1 ? '等速' : `${r}倍速` + (r > nativeMaxRate(s) ? '（シークで補完）' : ''));
}

const eachSlot = (all, fn) => { (all && slots.length ? slots : [focusSlot()]).forEach((s) => s && fn(s)); };

const keyActions = {
  // WASD はフォーカス移動（Shift 併用でも移動）
  w: () => moveFocus('up'),
  s: () => moveFocus('down'),
  a: () => moveFocus('left'),
  d: () => moveFocus('right'),
  b: (all) => { if (all) slots.forEach(restartSlot); else prevSlot(focusSlot()); },
  n: (all) => { if (all) slots.forEach(skipSlot); else skipSlot(focusSlot()); },
  z: (all) => eachSlot(all, (s) => { seekSlotBy(s, -5); osd('⏪ 5秒'); }),
  x: (all) => eachSlot(all, (s) => { seekSlotBy(s, 5); osd('5秒 ⏩'); }),
  c: (all) => eachSlot(all, (s) => { seekSlotBy(s, -30); osd('⏪ 30秒'); }),
  v: (all) => eachSlot(all, (s) => { seekSlotBy(s, 30); osd('30秒 ⏩'); }),
  ArrowUp: (all) => eachSlot(all, (s) => setSlotVolume(s, s.prefs.volume + 10)),
  ArrowDown: (all) => eachSlot(all, (s) => setSlotVolume(s, s.prefs.volume - 10)),
  m: (all) => eachSlot(all, (s) => {
    s.prefs.muted = !s.prefs.muted; prefs.muted = s.prefs.muted;
    applySlotPrefs(s); osd(s.prefs.muted ? 'ミュート' : `音量 ${s.prefs.volume}%`);
  }),
  f: (all) => eachSlot(all, (s) => setSlotRate(s, 1)),
  // G / H はもう一度押すと等速に戻る
  g: (all) => eachSlot(all, (s) => setSlotRate(s, s.prefs.rate === 2.5 ? 1 : 2.5)),
  h: (all) => eachSlot(all, (s) => setSlotRate(s, s.prefs.rate === 10 ? 1 : 10)),
  ' ': (all) => eachSlot(all, async (s) => {
    const p = await toggleSlot(s);
    if (s === focusSlot()) osd(p ? '▶ 再生' : '⏸ 停止');
  }),
};

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest('input, select, textarea')) return;
  // プリセットカード上のボタンにフォーカスがあるときは Space/文字キーをカード操作に譲る
  if (e.target.closest('#presetGrid button')) return;
  // 数字キーで同時再生数を指定（1=シングル、2-9=同時再生）
  if (/^[1-9]$/.test(e.key) && !e.shiftKey) {
    e.preventDefault();
    setMultiCount(+e.key);
    return;
  }
  const fn = keyActions[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!fn) return;
  e.preventDefault();
  fn(e.shiftKey);
});

// 動画内をクリックすると iframe にフォーカスが移りキーが届かなくなるため、親ページへ戻す
window.addEventListener('blur', () => setTimeout(() => {
  if (document.activeElement?.tagName === 'IFRAME') document.activeElement.blur();
}, 0));
// iframe クリックでは window の blur が発火しないブラウザがあるため、フォーカスが iframe に
// 残っている場合は定期的に親へ戻す（クリック自体は iframe に届くので再生ボタン等は押せる）
setInterval(() => {
  const ae = document.activeElement;
  if (ae && ae.tagName === 'IFRAME' && ae.closest('#grid')) ae.blur();
}, 100);

$('next').onclick = () => skipSlot(focusSlot());
$('prev').onclick = () => prevSlot(focusSlot());
$('scrMinus').onclick = () => setMultiCount(multiCount - 1);
$('scrPlus').onclick = () => setMultiCount(multiCount + 1);
$('scrCount').addEventListener('change', () => setMultiCount(+$('scrCount').value || 1));

// 現在のURLをコピーする。チェックを外すと ?st=（各動画の状態）を除いた
// 一覧読み込み用リンク（url/pages/filter/n）だけになる
$('copyLink').onclick = async () => {
  const u = new URL(location.href);
  if (!$('copyFull').checked) {
    u.searchParams.delete('st');
    // 動画情報を含めない場合も同時再生数は引き継ぐ
    u.searchParams.set('n', String(multiCount));
  }
  const text = u.href;
  try {
    await navigator.clipboard.writeText(text);
    osd('リンクをコピーしました');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); osd('リンクをコピーしました'); }
    catch { prompt('コピーしてください', text); }
    ta.remove();
  }
};

setMultiCount(4);

// ---- 再生状態のURL保存・復元 ----
// 同時再生数・各スロットの動画/再生位置/音量/速度を ?st= に保存し、
// URL共有や再読み込みで同じ状態を復元できるようにする
const b64u = (json) => btoa(String.fromCharCode(...new TextEncoder().encode(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (b) => {
  const s = b.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - b.length % 4) % 4);
  return new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)));
};

async function collectState() {
  const st = { n: multiCount, g: [prefs.volume, prefs.muted ? 1 : 0, prefs.rate], v: [] };
  for (const s of slots) {
    if (s.qi < 0 || !s.video) { st.v.push(null); continue; }
    const v = s.video;
    st.v.push({
      t: v.type, i: v.id, a: v.article || '',
      p: Math.round((await slotPosition(s)) * 10) / 10,
      vol: s.prefs.volume, m: s.prefs.muted ? 1 : 0, r: s.prefs.rate,
    });
  }
  return st;
}

function scheduleUrlUpdate() {
  clearTimeout(urlTimer);
  urlTimer = setTimeout(async () => {
    try {
      const u = new URL(location.href);
      u.searchParams.set('st', b64u(JSON.stringify(await collectState())));
      history.replaceState(null, '', u);
    } catch { /* 保存に失敗しても再生は続ける */ }
  }, 800);
}
// 再生位置は逐次変わるので定期的にも保存する
setInterval(scheduleUrlUpdate, 5000);

async function restoreState() {
  const b = new URLSearchParams(location.search).get('st');
  if (!b) return false;
  try {
    const st = JSON.parse(unb64u(b));
    if (!st || !Array.isArray(st.v)) return false;
    if (Array.isArray(st.g)) { prefs.volume = st.g[0]; prefs.muted = !!st.g[1]; prefs.rate = st.g[2] || 1; }
    await setMultiCount(st.n || st.v.length || 1);
    // スロットに出ていた動画をキューに戻し、同じindexで再割当てする
    const map = st.v.map((sv) => {
      if (!sv || !sv.t || !sv.i) return -1;
      queue.push({ type: sv.t, id: sv.i, article: sv.a || '', title: sv.a || '', thumb: null });
      return queue.length - 1;
    });
    loadFinished = true;
    st.v.forEach((sv, i) => {
      if (sv && map[i] >= 0 && slots[i]) {
        slots[i].prefs = { volume: sv.vol ?? 100, muted: !!sv.m, rate: sv.r || 1 };
        slotLoad(slots[i], map[i], sv.p || 0);
      }
    });
    pump();
    renderQueue();
    return true;
  } catch (e) {
    console.warn('状態の復元に失敗しました', e);
    return false;
  }
}

// ?url=<記事一覧URL>&pages=3&filter=... で開いたら、その一覧をすぐ読み込んで再生する
// ?st= がある場合はそちらを優先する
{
  const q = new URLSearchParams(location.search);
  if (q.get('st')) {
    restoreState();
  } else if (q.get('url')) {
    $('url').value = q.get('url');
    if (q.get('pages')) $('pages').value = q.get('pages');
    if (q.get('filter')) $('filter').value = q.get('filter');
    // n= で同時再生数を指定してから読み込みを開始する（共有リンク用）
    (async () => {
      if (q.get('n')) await setMultiCount(+q.get('n'));
      $('start').click();
    })();
  }
}
